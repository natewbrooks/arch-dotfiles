general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on  # to avoid having to press a key twice to turn on the display.
}

listener {
    timeout = 150                                # 2.5min.
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

# turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
listener { 
    timeout = 150                                          # 2.5min.
    on-timeout = ! grep -qs 1 /sys/class/power_supply/ADP0/online && brightnessctl -sd rgb:kbd_backlight set 0   # kbd off unless on AC (always on desktop).
    on-resume = brightnessctl -rd rgb:kbd_backlight        # turn on keyboard backlight.
}

listener {
    timeout = 300                                 # 5min
    on-timeout = ! grep -qs 1 /sys/class/power_supply/ADP0/online && loginctl lock-session   # lock unless on AC
}

listener {
    timeout = 330                                                     # 5.5min
    on-timeout = ! grep -qs 1 /sys/class/power_supply/ADP0/online && hyprctl dispatch dpms off   # screen off unless on AC
    on-resume = hyprctl dispatch dpms on && brightnessctl -r          # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 1800                                # 30min
    on-timeout = ! grep -qs 1 /sys/class/power_supply/ADP0/online && systemctl suspend   # suspend unless on AC
}
