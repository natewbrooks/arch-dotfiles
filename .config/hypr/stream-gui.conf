# Generated by Stream GUI. Add to hyprland.conf:  source = ~/.config/hypr/stream-gui.conf

# Stream GUI window: floating, centred; Alt+P shows/hides it (launches it if needed)
windowrule = match:class ^(stream-gui-desktop)$, float on, center on, size 1920 1080
# screen-share picker (instant replay asks which window to record when the Slippi window is not open): floating, centred
windowrule = match:class ^(hyprland-share-picker)$, float on, center on
bind = ALT, P, exec, /home/n8/dev/personal/stream-gui/desktop.sh --toggle

bind = CTRL SHIFT, F1, exec, curl -s -X POST -H 'X-Hub-Key: b75136ba53fcf7df1f5b9864e7f27d75' http://127.0.0.1:8765/api/action/fortune-chat   # Fortune
